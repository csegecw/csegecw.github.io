<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE GECW</title>
  <meta name="description" content="ACE GECW, official website.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="spotlight" aria-hidden="true"></div>

  <header class="top">
    <nav aria-label="Main">
      <a href="#about">About</a>
      <a href="#events">Events</a>
      <a href="#team">Team</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1 class="wordmark" aria-label="ACE GECW">
      <span class="letter" style="--i:0">A</span><span class="letter" style="--i:1">C</span><span class="letter" style="--i:2">E</span><span class="gap" aria-hidden="true"></span><span class="letter" style="--i:3">G</span><span class="letter" style="--i:4">E</span><span class="letter" style="--i:5">C</span><span class="letter" style="--i:6">W</span>
    </h1>

    <p class="tagline">
      Building the next generation of engineers, makers and problem solvers.
    </p>

    <!-- Placeholder numbers: replace with real figures. -->
    <ul class="stats">
      <li>
        <span class="num" data-count="10">10</span>
        <span class="label">Years<br>of activity</span>
      </li>
      <li>
        <span class="num" data-count="120">120</span>
        <span class="label">Events<br>hosted</span>
      </li>
    </ul>
  </main>

  <footer class="tags" aria-label="Focus areas">
    <span class="pill">Education</span>
    <span class="pill">Projects</span>
    <span class="pill">Workshops</span>
    <span class="pill">Research</span>
    <span class="pill pill--more" aria-label="More">&hellip;</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
